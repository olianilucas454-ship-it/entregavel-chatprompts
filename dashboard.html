<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pack Interativo de Prompts ChatGPT</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    .prompt-card {
      transition: all 0.2s ease-in-out;
    }
    .prompt-card:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body class="bg-[var(--background)] text-[var(--foreground)] font-sans antialiased min-h-screen p-4 md:p-8">

  <!-- Header Container -->
  <div class="max-w-6xl mx-auto mb-8">
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-[var(--card)] p-6 rounded-2xl border border-[var(--border)] shadow-sm">
      <div>
        <span class="inline-flex items-center gap-1.5 text-xs font-semibold px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-500 border border-emerald-500/20 mb-2">
          ⚡ ENTREGÁVEL INTERATIVO DIGITAL
        </span>
        <h1 class="text-2xl md:text-3xl font-bold tracking-tight">Pack de Comandos Secretos para ChatGPT</h1>
        <p class="text-[var(--muted-foreground)] text-sm mt-1">Busque, edite e copie com 1 clique os melhores prompts validados de IA.</p>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="copyAllPrompts()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-sm px-4 py-2.5 rounded-xl transition flex items-center gap-2 shadow-sm">
          <span>📋 Copiar Todos</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Main Container -->
  <div class="max-w-6xl mx-auto space-y-6">

    <!-- Filters and Search Bar -->
    <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
      <!-- Search Input -->
      <div class="relative w-full sm:w-80">
        <input 
          type="text" 
          id="searchInput" 
          oninput="filterPrompts()" 
          placeholder="Buscar prompt ou função..." 
          class="w-full bg-[var(--card)] border border-[var(--border)] rounded-xl px-4 py-2.5 text-sm text-[var(--foreground)] placeholder-[var(--placeholder)] focus:outline-none focus:ring-2 focus:ring-emerald-500/50"
        />
      </div>

      <!-- Category Filter Pills -->
      <div class="flex items-center gap-2 overflow-x-auto w-full sm:w-auto pb-2 sm:pb-0 scrollbar-none">
        <button onclick="setCategory('todos')" class="cat-btn active bg-emerald-600 text-white px-3.5 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap">Todos</button>
        <button onclick="setCategory('marketing')" class="cat-btn bg-[var(--card)] text-[var(--muted-foreground)] border border-[var(--border)] px-3.5 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap hover:text-[var(--foreground)]">Marketing & Vendas</button>
        <button onclick="setCategory('negocios')" class="cat-btn bg-[var(--card)] text-[var(--muted-foreground)] border border-[var(--border)] px-3.5 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap hover:text-[var(--foreground)]">Negócios & Carreira</button>
        <button onclick="setCategory('produtividade')" class="cat-btn bg-[var(--card)] text-[var(--muted-foreground)] border border-[var(--border)] px-3.5 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap hover:text-[var(--foreground)]">Produtividade</button>
        <button onclick="setCategory('saude')" class="cat-btn bg-[var(--card)] text-[var(--muted-foreground)] border border-[var(--border)] px-3.5 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap hover:text-[var(--foreground)]">Saúde & Treinos</button>
        <button onclick="setCategory('entretenimento')" class="cat-btn bg-[var(--card)] text-[var(--muted-foreground)] border border-[var(--border)] px-3.5 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap hover:text-[var(--foreground)]">Entretenimento</button>
      </div>
    </div>

    <!-- Prompts Grid -->
    <div id="promptsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-5">
      <!-- Generated by JS -->
    </div>

  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-6 right-6 bg-emerald-600 text-white font-medium text-sm px-4 py-3 rounded-xl shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 flex items-center gap-2 pointer-events-none">
    <span>✅ Prompt copiado para a área de transferência!</span>
  </div>

  <script>
    const promptsData = [
      {
        id: 1,
        title: "Copywriter de Alta Conversão",
        category: "marketing",
        tags: ["Copywriting", "Anúncios", "Vendas"],
        role: "Redator Profissional",
        prompt: "Quero que você atue como meu redator e especialista em Copywriting de resposta direta. Sua função é escrever textos extremamente persuasivos para anúncios, e-mails de vendas e landing pages. Utilize gatilhos mentais de urgência, escassez e prova social. Meu primeiro pedido é: 'Escreva um anúncio para o produto {seu_produto}.'"
      },
      {
        id: 2,
        title: "Diretor de Campanhas & Publicitário",
        category: "marketing",
        tags: ["Publicidade", "Branding", "Campanhas"],
        role: "Publicitário Sênior",
        prompt: "Eu quero que você atue como um publicitário. Você criará uma campanha completa para promover um produto ou serviço de sua escolha. Você escolherá um público-alvo, desenvolverá mensagens-chave e slogans, selecionará os canais de mídia para a promoção e decidirá sobre atividades para alcançar os objetivos."
      },
      {
        id: 3,
        title: "Vendedor de Alta Performance",
        category: "marketing",
        tags: ["Vendas", "Objeções", "Simulação"],
        role: "Vendedor Experiente",
        prompt: "Eu quero que você atue como um vendedor profissional. Tente me vender algo, mas faça parecer mais valioso do que é e me convença a comprá-lo. Agora, vou fingir que você está me ligando e perguntar pelo que você está ligando. Olá, pelo que você está ligando?"
      },
      {
        id: 4,
        title: "Consultor de SEO & Ranqueamento",
        category: "marketing",
        tags: ["SEO", "Google", "Tráfego Orgânico"],
        role: "Consultor de SEO",
        prompt: "Quero que você atue como um consultor de SEO. Vou te fornecer informações sobre o meu site e você deve avaliar a estratégia de otimização para mecanismos de busca atual e me fornecer sugestões práticas de melhoria de palavras-chave e estrutura."
      },
      {
        id: 5,
        title: "Gerador de Startups (Plano Canvas)",
        category: "negocios",
        tags: ["Startups", "Plano de Negócios", "Inovação"],
        role: "Mentor de Startups",
        prompt: "Gerar ideias de startups digitais baseadas no desejo das pessoas. Por exemplo, quando eu digo 'Eu gostaria que houvesse um grande shopping center na minha cidade pequena', você gera um plano de negócios para a startup digital completo em uma tabela markdown com: Nome, Resumo, Persona, Dores Resolvidas, Proposição de Valor, Canais, Fontes de Receita e Custos do 1º Ano."
      },
      {
        id: 6,
        title: "Contador & Gestão Financeira",
        category: "negocios",
        tags: ["Finanças", "Contabilidade", "Orçamento"],
        role: "Contador Empresarial",
        prompt: "Eu quero que você atue como um contador e crie maneiras criativas de gerenciar finanças. Você precisará considerar o orçamento, estratégias de investimento e gerenciamento de riscos ao criar um plano financeiro para seu cliente."
      },
      {
        id: 7,
        title: "Coach de Carreira & Promoções",
        category: "negocios",
        tags: ["Carreira", "Entrevistas", "Liderança"],
        role: "Coach Profissional",
        prompt: "Quero que você atue como um coach de carreira. Vou contar minha experiência e objetivos profissionais, e você deve fornecer conselhos sobre como melhorar minhas habilidades e avançar na minha carreira."
      },
      {
        id: 8,
        title: "Coach de Produtividade & Foco",
        category: "produtividade",
        tags: ["Foco", "Rotina", "Alta Performance"],
        role: "Coach de Produtividade",
        prompt: "Quero que atue como um coach de produtividade. Você deve me ajudar a melhorar minha eficiência no trabalho e desenvolver um plano para atingir minhas metas. Meu primeiro pedido é 'Crie uma rotina diária para melhorar meu foco e concentração no trabalho.'"
      },
      {
        id: 9,
        title: "Professor de Inglês Falado",
        category: "produtividade",
        tags: ["Inglês", "Idiomas", "Conversação"],
        role: "Professor de Inglês",
        prompt: "Eu quero que você atue como um professor e aperfeiçoador de inglês falado. Eu vou falar com você em inglês e você vai me responder em inglês para praticar meu inglês falado. Limite sua resposta a 100 palavras. Corrija estritamente meus erros gramaticais e me faça uma pergunta na sua resposta."
      },
      {
        id: 10,
        title: "Personal Trainer Personalizado",
        category: "saude",
        tags: ["Treinos", "Fitness", "Emagrecimento"],
        role: "Personal Trainer",
        prompt: "Eu quero que você atue como um personal trainer. Eu vou fornecer todas as informações necessárias sobre um indivíduo que deseja se tornar mais apto, mais forte e mais saudável, e seu papel é elaborar o melhor plano de treino dependendo do nível de condicionamento e objetivos."
      },
      {
        id: 11,
        title: "Nutricionista Pessoal",
        category: "saude",
        tags: ["Dieta", "Alimentação", "Saúde"],
        role: "Nutricionista",
        prompt: "Quero que você atue como um nutricionista. Vou compartilhar minha rotina alimentar e você deverá fornecer sugestões para melhorar minha dieta e atingir minhas metas de saúde."
      },
      {
        id: 12,
        title: "Roleplay de Personagem de Série",
        category: "entretenimento",
        tags: ["Séries", "Filmes", "Personagens"],
        role: "Ator de Personagem",
        prompt: "Eu quero que você atue como {personagem} da série {nome_da_serie}. Eu quero que você responda como {personagem} usando o tom, maneira e vocabulário que {personagem} usaria. Não escreva nenhuma explicação. Apenas responda como {personagem}."
      }
    ];

    let currentCategory = 'todos';

    function renderPrompts() {
      const grid = document.getElementById('promptsGrid');
      const search = document.getElementById('searchInput').value.toLowerCase();

      const filtered = promptsData.filter(item => {
        const matchesCategory = currentCategory === 'todos' || item.category === currentCategory;
        const matchesSearch = item.title.toLowerCase().includes(search) || 
                              item.prompt.toLowerCase().includes(search) ||
                              item.role.toLowerCase().includes(search);
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full py-12 text-center bg-[var(--card)] rounded-2xl border border-[var(--border)]">
            <p class="text-[var(--muted-foreground)] text-sm">Nenhum prompt encontrado para esta busca.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(item => `
        <div class="prompt-card bg-[var(--card)] border border-[var(--border)] rounded-2xl p-5 flex flex-col justify-between shadow-sm">
          <div>
            <div class="flex items-center justify-between gap-2 mb-3">
              <span class="text-xs font-semibold px-2.5 py-1 rounded-md bg-emerald-500/10 text-emerald-500 border border-emerald-500/20">
                ${item.role}
              </span>
              <div class="flex gap-1">
                ${item.tags.map(t => `<span class="text-[10px] text-[var(--muted-foreground)] bg-[var(--background)] px-2 py-0.5 rounded-full border border-[var(--border)]">${t}</span>`).join('')}
              </div>
            </div>
            <h3 class="font-bold text-base mb-2 text-[var(--foreground)]">${item.title}</h3>
            <div class="bg-[var(--background)] p-3.5 rounded-xl border border-[var(--border)] text-xs text-[var(--foreground)] font-mono leading-relaxed mb-4 select-all">
              ${item.prompt}
            </div>
          </div>
          <button onclick="copyPrompt('${encodeURIComponent(item.prompt)}')" class="w-full bg-[var(--background)] hover:bg-emerald-600 hover:text-white border border-[var(--border)] hover:border-emerald-600 text-[var(--foreground)] font-medium text-xs py-2.5 rounded-xl transition flex items-center justify-center gap-2">
            <span>📋 Copiar Prompt</span>
          </button>
        </div>
      `).join('');
    }

    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.remove('active', 'bg-emerald-600', 'text-white');
        btn.classList.add('bg-[var(--card)]', 'text-[var(--muted-foreground)]');
      });
      event.target.classList.remove('bg-[var(--card)]', 'text-[var(--muted-foreground)]');
      event.target.classList.add('active', 'bg-emerald-600', 'text-white');
      renderPrompts();
    }

    function filterPrompts() {
      renderPrompts();
    }

    function copyPrompt(encodedPrompt) {
      const text = decodeURIComponent(encodedPrompt);
      navigator.clipboard.writeText(text);
      showToast();
    }

    function copyAllPrompts() {
      const allText = promptsData.map(p => `--- ${p.title} (${p.role}) ---\n${p.prompt}\n`).join('\n');
      navigator.clipboard.writeText(allText);
      showToast('✅ Todos os 12 prompts foram copiados!');
    }

    function showToast(msg = '✅ Prompt copiado para a área de transferência!') {
      const toast = document.getElementById('toast');
      toast.querySelector('span').innerText = msg;
      toast.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 2500);
    }

    // Initial Render
    renderPrompts();
  </script>
</body>
</html>
